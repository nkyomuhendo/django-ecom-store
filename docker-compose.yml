services:
  ecom_web_app:
    depends_on:
      - postgres_db
    build:
      context: .
    image: registry.digitalocean.com/nix-ecom-rep/ecomwebapp:latest
    volumes:
      - static_data:/vol/web
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
    env_file:
      - ./.env
    # command: sh -c "chmod +x /scripts/migrate.sh && sh /scripts/migrate.sh && sh /scripts/entrypoint.sh"
    command: sh -c "/scripts/entrypoint.sh"
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
    volumes:
      - static_data:/vol/static
    ports:
      - "8080:8080"
      # - "443:443"
    depends_on:
      - ecom_web_app
    restart: unless-stopped

  postgres_db:
    image: postgres:17
    env_file:
      - ./.env
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: unless-stopped

volumes:
  static_data:
  postgres_data: